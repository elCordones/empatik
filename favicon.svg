<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d9381e"/>
    </linearGradient>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Carta posterior girada -->
  <rect x="10" y="8" width="34" height="46" rx="6" transform="rotate(-10 27 31)" fill="url(#backGrad)" stroke="#64748b" stroke-width="1.5" opacity="0.95"/>
  <circle cx="24" cy="28" r="6" fill="#475569" opacity="0.6"/>

  <!-- Carta frontal amb ombra -->
  <g filter="url(#shadow)">
    <rect x="18" y="10" width="34" height="46" rx="6" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Icona d'empatia: cor i ressonància visual -->
    <path d="M35 24.5c-2.2-2.7-6.2-2.9-8.4-.5-2.2 2.4-1.9 6.3.7 8.7L35 39.5l7.7-6.8c2.6-2.4 2.9-6.3.7-8.7-2.2-2.4-6.2-2.2-8.4.5z" fill="#ffffff"/>
    <!-- Ones d'empatia / connexió sobre el cor -->
    <path d="M25 21a12 12 0 0 1 20 0" fill="none" stroke="#fed7aa" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
